name: Royal library checks
on:
  pull_request:
    paths: ['recommend/**', 'app.js', 'index.html', '.github/workflows/library-check.yml']
  push:
    branches: [main]
    paths: ['recommend/**', 'app.js', 'index.html', '.github/workflows/library-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: recommend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: recommend
      - run: npm run check
        working-directory: recommend
      - name: Actual D1 migration
        run: npx wrangler d1 migrations apply nero-library --local
        working-directory: recommend
      - name: Pages service proxy build
        run: npx wrangler pages functions build web/functions --outdir /tmp/library-functions
        working-directory: recommend
      - name: Existing reader regression
        run: |
          node --check app.js
          node mcp/test.mjs
          node mcp/fast-sync.test.mjs
          node members/test.mjs
