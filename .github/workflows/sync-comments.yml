name: Sync note comments

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force rescan
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: sync-note-comments
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync comments
        env:
          NOTE_OWNER: nero_notelover
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.force == 'true' }}
        run: npm run sync

      - name: Commit updated data
        run: |
          if git diff --quiet -- data; then
            echo "No changes"
            exit 0
          fi
          cp data/inbox.json /tmp/inbox.json
          cp data/state.json /tmp/state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/inbox.json data/inbox.json
          cp /tmp/state.json data/state.json
          git config user.name "nero-comment-reader[bot]"
          git config user.email "nero-comment-reader@users.noreply.github.com"
          git add data
          git commit -m "Update unread comment data"
          git push
