<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11131a">
  <title>王子 Comment Reader 🌙</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">NERO NOTE HUB</p>
      <h1>王子 Comment Reader <span>🌙</span></h1>
      <p class="lead">返信と、イベント参加者へのご挨拶をここから。</p>
    </div>
    <button id="refreshBtn" class="secondary">↻ 最新コメントを取得</button>
  </header>

  <nav class="tabs" aria-label="機能">
    <button class="tab active" data-view="comments">💬 コメント</button>
    <button class="tab" data-view="events">🎪 イベント</button>
    <button class="tab disabled" title="準備中">🔗 引用 <small>準備中</small></button>
    <button class="tab disabled" title="準備中">👀 ウォッチリスト <small>準備中</small></button>
  </nav>

  <main>
    <section id="commentsView" class="view active">
      <section class="summary">
        <div class="countCard">
          <span class="label">未返信</span>
          <strong id="count">—</strong>
          <span class="unit">件</span>
        </div>
        <div class="meta">
          <div>最終同期 <strong id="updatedAt">—</strong></div>
          <div>確認記事 <strong id="articleCount">—</strong></div>
        </div>
      </section>

      <section class="syncPanel">
        <div class="syncTop">
          <div>
            <span class="syncLabel">更新方式</span>
            <strong id="syncState">手動取得</strong>
          </div>
          <div class="nextSync">自動同期 <strong>OFF</strong></div>
        </div>
        <div class="progressTrack"><div id="progressFill" class="progressFill"></div></div>
        <div id="syncDetail" class="syncDetail">「最新コメントを取得」を押した時だけnoteを確認します。</div>
      </section>

      <section class="toolbar">
        <input id="searchInput" type="search" placeholder="名前・記事・コメントを検索">
      </section>

      <section id="status" class="status">読み込み中…</section>
      <section id="comments" class="comments" aria-live="polite"></section>
    </section>

    <section id="eventsView" class="view">
      <section class="eventIntro">
        <p class="eyebrow">EVENT PATROL</p>
        <h2>企画参加記事を探す 🎪</h2>
        <p>王子自身の記事と、王子がすでにコメントした記事を除外して表示します。</p>
      </section>

      <section class="eventSearchGrid">
        <div class="eventSearchBox">
          <label for="hashtagInput"># ハッシュタグ</label>
          <div class="eventSearchRow">
            <input id="hashtagInput" type="text" value="#秋読コレクション" placeholder="#秋読コレクション">
            <button id="hashtagSearchBtn" class="primaryAction">検索</button>
          </div>
        </div>
        <div class="eventSearchBox">
          <label for="magazineInput">📚 マガジンURL / キー</label>
          <div class="eventSearchRow">
            <input id="magazineInput" type="text" value="https://note.com/nero_notelover/m/mbdfa1301e316" placeholder="https://note.com/.../m/mxxxxxxxxxxxx">
            <button id="magazineSearchBtn" class="primaryAction">検索</button>
          </div>
        </div>
      </section>

      <section class="eventActions">
        <button id="copyEventBatchBtn" class="secondary hidden">✨ 表示中をまとめてChatGPT用にコピー</button>
      </section>

      <section id="eventStatus" class="status">#タグまたはマガジンから検索してください。</section>
      <section id="eventResults" class="comments" aria-live="polite"></section>
    </section>
  </main>

  <template id="commentTemplate">
    <article class="commentCard">
      <div class="commentHead">
        <div class="authorWrap">
          <img class="avatar" alt="">
          <div>
            <strong class="author"></strong>
            <div class="date"></div>
          </div>
        </div>
        <span class="badge">未返信</span>
      </div>
      <a class="articleTitle" target="_blank" rel="noopener"></a>
      <p class="commentBody"></p>
      <div class="actions">
        <button class="primary askBtn">✨ ChatGPT用にコピー</button>
        <a href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPTを開く ↗</a>
        <button class="copyBtn">コメントだけコピー</button>
        <a class="noteBtn" target="_blank" rel="noopener">noteで開く ↗</a>
      </div>
    </article>
  </template>

  <div id="toast" class="toast" role="status"></div>
  <script src="./app.js" defer></script>
</body>
</html>
